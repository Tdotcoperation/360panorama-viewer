<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>360 Panorama Viewer</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section id="picker" class="picker"><div class="pick-card"><div class="logo">360°</div><h1>Panorama Viewer</h1><p>파노라마 사진을 선택하거나 여기에 끌어다 놓으세요.</p><button id="pickBtn">사진 선택</button><input id="fileInput" type="file" accept="image/*,.heic,.heif,.tif,.tiff" hidden><small>사진은 서버에 업로드되지 않습니다.</small></div></section><section id="viewer" class="viewer hidden"><canvas id="canvas"></canvas><div id="status" class="status hidden"></div><button id="back" class="round top-left" aria-label="다른 사진 열기">＋</button><div id="controls" class="controls"><button data-action="out">−</button><button data-action="reset">초기화</button><button data-action="auto">자동회전</button><button data-action="blend">연결부</button><button data-action="full">⛶</button><button data-action="in">＋</button></div><div class="hint">드래그하여 둘러보기 · 두 번 탭/클릭하여 전체화면</div></section></main><script src="/app.js"></script></body></html>
